kind = "web"
previewPath = "/"
title = "روايتي - Literary Platform"
version = "1.0.0"
id = "artifacts/literary-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/literary-platform run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/literary-platform", "run", "build"]
publicDir = "artifacts/literary-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
